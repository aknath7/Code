<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131f">
  <title>Hello, world by AJ! — A little moment of wonder</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f5ff;
      --muted: #b9b9ce;
      --violet: #b7a0ff;
      --cyan: #8be6e1;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% 110%, rgba(91, 63, 179, .32), transparent 55%),
        radial-gradient(ellipse at 10% 5%, rgba(54, 153, 164, .12), transparent 42%),
        #10131f;
    }
    .grain {
      position: fixed; inset: 0; pointer-events: none; opacity: .15;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");
    }
    .orbit {
      position: fixed; width: min(76vw, 720px); aspect-ratio: 1; border: 1px solid rgba(203, 197, 255, .09);
      border-radius: 50%; pointer-events: none; animation: turn 50s linear infinite;
    }
    .orbit::before, .orbit::after { content: ""; position: absolute; border: 1px solid rgba(203,197,255,.06); border-radius: 50%; inset: 9%; }
    .orbit::after { inset: 19%; }
    .spark { position: absolute; top: 13%; left: 19%; width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 18px 4px rgba(139,230,225,.5); }
    main {
      position: relative; width: min(90vw, 760px); padding: clamp(2.5rem, 8vw, 6.25rem) 1.5rem;
      text-align: center; animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
    }
    .eyebrow { display: inline-flex; align-items: center; gap: .65rem; color: var(--cyan); font-size: .72rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    .eyebrow::before, .eyebrow::after { content: ""; width: 25px; height: 1px; background: currentColor; opacity: .65; }
    h1 {
      margin: 1.35rem 0 1rem; font-size: clamp(3.4rem, 10vw, 7.25rem); line-height: .98;
      letter-spacing: -.075em; font-weight: 650;
    }
    h1 span { color: transparent; background: linear-gradient(115deg, #fff 14%, #c7b7ff 55%, #87e4dc 100%); background-clip: text; -webkit-background-clip: text; }
    .subtitle { margin: 0 auto; max-width: 420px; color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.15rem); line-height: 1.75; }
    .rule { width: 42px; height: 1px; margin: 2rem auto; background: linear-gradient(90deg, transparent, rgba(183,160,255,.8), transparent); }
    .note { color: #85869d; font-size: .78rem; letter-spacing: .04em; }
    .note b { color: #d9d1ff; font-weight: 500; }
        .site-nav { position: fixed; z-index: 2; top: 1.5rem; left: 50%; transform: translateX(-50%); display: flex; gap: .35rem; padding: .35rem; border: 1px solid rgba(203,197,255,.14); border-radius: 999px; background: rgba(18,20,34,.72); backdrop-filter: blur(14px); }
    .site-nav a { padding: .65rem 1rem; border-radius: 999px; color: #b9b9ce; text-decoration: none; font-size: .82rem; transition: color .2s, background .2s; }
    .site-nav a:hover, .site-nav a[aria-current="page"] { color: #fff; background: rgba(183,160,255,.16); }
    @media (max-width: 520px) { .site-nav { top: 1rem; } }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="orbit" aria-hidden="true"><span class="spark"></span></div>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="index.html" aria-current="page">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <div class="eyebrow">A fresh beginning</div>
    <h1><span>Hello, world! My Name is Anjan Nath!!</span></h1>
    <p class="subtitle">A small page, a whole universe of possibility.<br>Glad you’re here.</p>
    <div class="rule" aria-hidden="true"></div>
    <p class="note">Made with <b>curiosity</b> &amp; a little bit of CSS and HTML</p>
  </main>
</body>
</html>
